<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        /* Gives everything a thin gray border to see the general box model */
* {
    box-sizing: border-box;
}

/* The Main Containers */
header {
    border: 3px solid #ff4757; /* Red */
    padding: 10px;
    margin-bottom: 10px;
}

nav {
    border: 2px dashed #2ed573; /* Green */
    background-color: #f1f2f6;
}

main {
    border: 3px solid #1e90ff; /* Blue */
    padding: 20px;
}

/* Differentiating Divs vs Sections */
section {
    border: 2px solid #ffa502; /* Orange */
    margin: 15px 0;
    padding: 10px;
    background-color: #fffaf0;
}

div {
    border: 2px dotted #5352ed; /* Purple */
    margin: 10px 0;
    padding: 5px;
}

footer {
    border: 3px solid #2f3542; /* Dark Gray */
    margin-top: 20px;
}
    </style>
    <title>My Awesome Site</title>
</head>
<body>
    <header>
        <h1>Welcome to My Website</h1>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Latest News</h2>
            <p>HTML is the backbone of the web.</p>
            <img src="logo.png" alt="Company Logo">
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Web Project</p>
    </footer>
</body>
</html>
